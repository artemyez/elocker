AllCops:
  TargetRubyVersion: 3.3
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - db/schema.rb
    - vendor/**/*
    - storage/**/*
    - tmp/**/*
    - log/**/*

Layout/IndentationWidth:
  Width: 2

Layout/LineLength:
  Max: 120

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: single_quotes

Style/FrozenStringLiteralComment:
  EnforcedStyle: always

Style/HashSyntax:
  EnforcedStyle: ruby19

Layout/TrailingWhitespace:
  Enabled: true

Layout/TrailingEmptyLines:
  EnforcedStyle: final_newline

# A migration is one declarative schema definition, not logic.
Metrics:
  Exclude:
    - db/migrate/**/*

# RSpec example groups declare a collection of independent examples.
Metrics/BlockLength:
  AllowedMethods:
    - describe
    - context
    - shared_context
